<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>인생네컷 웹 포토부스</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 휴대폰 세로 화면 중심의 전체 포토부스 상자 -->
  <main id="app-container" class="booth-container">
    <header id="app-header" class="booth-header">
      <h1 id="app-title" class="booth-title">인생네컷</h1>
    </header>

    <!-- 화면 ①: 프레임 테마 & 컷 수 고르기 (section#select-section) -->
    <section id="select-section" class="screen-section">
      <!-- 촬영 전 프레임 테마 미리보기 선택 영역 -->
      <div class="frame-picker-block">
        <p id="pre-frame-guide" class="guide-text">1. 함께 찍을 캐릭터 프레임을 골라 주세요</p>
        <div id="pre-frames" class="frames-preview-grid" role="group" aria-label="촬영 전 프레임 테마 선택"></div>
      </div>

      <p id="select-guide" class="guide-text">2. 촬영할 컷 수를 누르면 카메라가 켜집니다</p>

      <div id="cut-btn-group" class="cut-choice-grid">
        <!-- 2컷 선택 버튼 (class="cut-btn", data-cuts="2") -->
        <button id="cut-2-btn" type="button" class="cut-btn" data-cuts="2">
          <span id="icon-2cut" class="cut-icon" aria-hidden="true">
            <span class="cut-box"></span>
            <span class="cut-box"></span>
          </span>
          <span class="cut-label">2컷 촬영</span>
        </button>

        <!-- 4컷 선택 버튼 (class="cut-btn", data-cuts="4") -->
        <button id="cut-4-btn" type="button" class="cut-btn" data-cuts="4">
          <span id="icon-4cut" class="cut-icon" aria-hidden="true">
            <span class="cut-box"></span>
            <span class="cut-box"></span>
            <span class="cut-box"></span>
            <span class="cut-box"></span>
          </span>
          <span class="cut-label">4컷 촬영 (캐릭터)</span>
        </button>
      </div>
    </section>

    <!-- 화면 ②: 촬영 화면 (section#shoot-section, 처음엔 hidden) -->
    <section id="shoot-section" class="screen-section hidden">
      <div id="camera-box" class="preview-frame">
        <!-- 실시간 카메라 영상 (전면 카메라 거울 반전) -->
        <video id="video" autoplay playsinline webkit-playsinline muted></video>
        <!-- 현재 촬영할 컷(1~4컷)의 캐릭터만 실시간으로 보여주는 투명 오버레이 (반전 없음) -->
        <img id="char-overlay" class="char-overlay hidden" alt="현재 컷 캐릭터 실시간 오버레이">
        <!-- 카메라 위 왼쪽 위에 진행 표시 (div#progress) -->
        <div id="progress" class="progress-badge">1 / 4</div>
        <!-- 5초 카운트다운 숫자 표시 -->
        <div id="countdown" class="countdown-overlay hidden">5</div>
      </div>

      <!-- 아래에 찍은 사진 작은 미리보기 줄 (div#thumbs) -->
      <div id="thumbs" class="thumbs-row" aria-label="찍은 사진 미리보기"></div>

      <!-- 상태 및 오류 안내 문장 (p#message) -->
      <p id="message" class="message-text">화면에 나타난 캐릭터 옆에 얼굴을 맞추고 촬영을 시작해 보세요!</p>

      <!-- 촬영 시작 버튼 (button#shoot-btn) -->
      <button id="shoot-btn" type="button" class="primary-btn">촬영 시작</button>
    </section>

    <!-- 화면 ③: 결과 화면 (section#result-section, 처음엔 hidden) -->
    <section id="result-section" class="screen-section hidden">
      <h2 id="result-title" class="result-title">완성!</h2>

      <!-- 촬영 후에도 사진을 유지한 채 프레임을 자유롭게 변경하는 미리보기 선택 줄 -->
      <div class="frame-picker-block">
        <p id="result-frame-guide" class="guide-text">프레임 바꾸기 (찍은 사진은 그대로 유지돼요)</p>
        <div id="result-frames" class="frames-scroll-row" role="group" aria-label="촬영 후 프레임 테마 변경"></div>
      </div>

      <!-- 결과 사진 위에 안내 문장 "필터를 골라 보세요"와 빈 상자 div#filters (버튼은 js가 자동으로 생성) -->
      <p id="filter-guide" class="guide-text">필터를 골라 보세요</p>
      <div id="filters" class="filters-row" role="group" aria-label="사진 필터 선택"></div>

      <div id="result-box" class="result-frame">
        <!-- 완성된 세로 프레임 사진 (img#result-photo, class="strip", 너비 최대 320px, 그림자) -->
        <img id="result-photo" class="strip" alt="완성된 인생네컷 세로 프레임 사진">
      </div>

      <!-- 선택한 프레임이 적용된 최종 사진 기기 저장 및 QR코드 공유 버튼 -->
      <div class="result-actions-group">
        <button id="download-btn" type="button" class="secondary-btn">사진 파일로 저장하기</button>
        <button id="qr-btn" type="button" class="primary-btn qr-action-btn">QR코드로 휴대폰에 받기</button>
      </div>
      <p id="qr-message" class="message-text"></p>

      <div id="qr-box" class="qr-card hidden">
        <p id="qr-guide-top" class="qr-guide-text">휴대폰 카메라로 QR코드를 비춰 보세요</p>
        <div id="qrcode" class="qrcode-holder" aria-label="사진 다운로드 QR코드"></div>
        <p id="qr-guide-bottom" class="qr-sub-text">열린 사진을 길게 눌러 저장하세요</p>
        <a id="photo-link" class="photo-open-link" href="#" target="_blank" rel="noopener noreferrer">새 창으로 사진 열기</a>
      </div>

      <!-- 처음으로 버튼 (1단계의 retake-btn이 restart-btn으로 바뀜) -->
      <button id="restart-btn" type="button" class="secondary-btn">처음으로</button>
    </section>
  </main>

  <!-- 일반 script 태그를 ARCHITECTURE.md 순서대로 불러오기 (CDN 2개 → config → camera → frame → filters → upload → app) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/frame.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
